[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "0.1.0"
description = "IA personal local: modelo abierto (Ollama) + memoria persistente + razonamiento verificado + herramientas"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentx = "agentx.cli:main"

[tool.setuptools]
packages = ["agentx"]
